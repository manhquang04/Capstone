resources:
  maximum_feasible_target_count:
    approved: 150
    basis: "measured runtime probe on development_gate_targets.pt group 0,
      2026-09-12: raw 15.26s/restart, DNA-surrogate 15.85s/candidate-restart,
      clipping/noise-MC 14.72s/restart at 600 iterations; frozen budget R8 raw,
      4 realizations x R8 DNA, R8 DP-MC => ~747s/target => 150 targets is
      ~3.4x required_confirmatory_target_count (44) at ~31 CPU-hours serial"
  maximum_machine_hours:
    approved: null
    status: REMOVED_BY_SUPERVISOR
    amendment: ../amendments/2026-09-13_resource_ceiling_removed.md
  maximum_artifact_gb:
    approved: 500
  safety_factor:
    proposed: 1.25
    approved: 1.25

benchmark_provenance:
  probe_date: 2026-09-12
  hardware: "MacBook Pro, Apple M1 Pro, 32GB RAM, CPU-only for the attacker
    (attacks run on torch.device('cpu') by implementation contract; MPS is
    available on this machine for RQ2 training but is not used by the attack
    scripts)"
  parallelism_model: "one process per target/restart unit, each pinned to a
    single CPU thread (torch.set_num_threads(1), unchanged by design); scale
    throughput by running multiple processes concurrently, not by increasing
    per-process thread count, to avoid oversubscription on a 10-core machine"
  recommended_concurrent_workers: 9

scope:
  records_per_group: 4
  fraud_records_per_group: 1
  local_optimizer: Adam
  local_steps: 1
  known_architecture: true
  oracle_class_decomposed_labels: false

dna_transform:
  selection_status: approved_existing_conservative
  block_size: 256
  mix_ratio: 0.08
  keep_ratio: 0.88
  shrink_factor: 0.45
  seed_derivation: deterministic_per_round_client_seed_from_dna_transform_run_seed
    # as implemented in dna_encoder/transform_defense.py; see README "Dynamic
    # Seed Verification". Inherited from existing code, not a new decision.

dp_distortion_calibration:
  clip_norm_grid: [100.0]
  noise_multiplier_grid: [0.0001, 0.0002, 0.00025, 0.0003, 0.0005, 0.001, 0.005, 0.01]
  grid_amendment_source: ../amendments/2026-09-12_rq1_distortion_grid_expansion.md
  target_statistic: median_relative_l2
  matching_tolerance:
    proposed: 0.05
    approved: 0.05
    note: "5% relative deviation from DNA's median relative-L2 on development
      groups; assistant-proposed engineering default, flagged for a quick
      supervisor nod rather than a full survey round"
  noise_realizations:
    proposed: 100
    approved: 100
    note: "inherited from the Phase 4 clipping/noise Monte Carlo precedent
      (N=100), not a new value"
  calibration_seed_list:
    proposed: [11, 22, 33, 44, 55]
    approved: [11, 22, 33, 44, 55]
    note: "assistant-proposed fixed 5-seed calibration list; arbitrary but
      fixed before grid execution, flagged for a quick supervisor nod"
  tie_breaker: smallest_noise_multiplier_among_equal_absolute_distances
  save_full_grid: true
  selected_candidate:
    status: approved
    clip_norm: 100.0
    noise_multiplier: 0.00025
    evidence: ../../artifacts/rq1/stage1_distortion_calibration_shared_impl_expanded_20260912/calibration_report.json
    approval_source: ../amendments/2026-09-13_stage1_supervisor_approvals.md

