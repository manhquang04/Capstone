schema_version: 1
protocol_id: RQ1-IMAGE-DOMAIN-GENERALIZATION-DEVELOPMENT
config_id: RQ1-IMAGE-DOMAIN-PRE-PILOT-V1
status: DEVELOPMENT-GATE AUTHORIZED
execution_authorized: true
created_at: 2026-09-17T00:00:00+07:00
purpose: >
  Development-gate exploration of whether the RQ1 attacker-strength lesson
  from tabular PaySim/IEEE-CIS repeats on a natural image domain. This config
  does not alter any frozen tabular RQ1/RQ2/RQ3 conclusion and does not
  authorize confirmatory execution.

quick_nod_required:
  supervisor: Manh Quang
  required_before_execution: false
  approved_at: 2026-09-17T00:00:00+07:00
  approval_channel: chat_session
  decisions_to_approve:
    - cnn_architecture
    - optimizer_and_learning_rate
    - image_scope_definition
    - attacker_priority_matrix
    - psnr_ssim_metric_adapter
  note: >
    Supervisor approved all listed quick-nod decisions on 2026-09-17. This
    authorizes development-gate execution only; confirmatory execution remains
    explicitly unauthorized.

